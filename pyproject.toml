[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-four"
version = "0.1.0"
description = "Connect Four engine with perfect-play solver, RL and LLM exploration hooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gao Qiran" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
connect-four = "connect_four.cli:main"

[tool.setuptools.packages.find]
include = ["connect_four*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
